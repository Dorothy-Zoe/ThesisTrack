name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: thesis_track_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot > /dev/null 2>&1 && break
            sleep 2
          done
          # Additional delay to ensure MySQL is fully ready
          sleep 3
          # Test the connection
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES;"

      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS thesis_track_test;"
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES;"

      - name: Import test database schema
        run: |
          if [ -f "db/thesis_track_test.sql" ]; then
            mysql -h 127.0.0.1 -uroot -proot thesis_track_test < db/thesis_track_test.sql
          else
            echo "No test SQL file found, creating basic tables..."
            mysql -h 127.0.0.1 -uroot -proot thesis_track_test -e "
              CREATE TABLE IF NOT EXISTS advisors (
                id INT AUTO_INCREMENT PRIMARY KEY,
                first_name VARCHAR(50),
                last_name VARCHAR(50),
                email VARCHAR(100),
                password VARCHAR(255)
              );
              CREATE TABLE IF NOT EXISTS students (
                id INT AUTO_INCREMENT PRIMARY KEY,
                first_name VARCHAR(50),
                last_name VARCHAR(50),
                email VARCHAR(100),
                password VARCHAR(255)
              );
              CREATE TABLE IF NOT EXISTS coordinators (
                id INT AUTO_INCREMENT PRIMARY KEY,
                first_name VARCHAR(50),
                last_name VARCHAR(50),
                email VARCHAR(100),
                password VARCHAR(255)
              );
            "
          fi

      - name: Verify database tables
        run: |
          mysql -h 127.0.0.1 -uroot -proot thesis_track_test -e "SHOW TABLES;"

      - name: Run PHPUnit tests
        run: php vendor/bin/phpunit --configuration phpunit.xml
