name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: thesis_track_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysqladmin ping -h mysql -uroot -proot --silent; do
            sleep 2
          done

      - name: Import test database
        run: mysql -h mysql -uroot -proot thesis_track_test < db/thesis_track_test.sql

      - name: Run PHPUnit tests
        env:
          DB_HOST: mysql
          DB_NAME: thesis_track_test
          DB_USER: root
          DB_PASS: root
        run: php vendor/bin/phpunit --configuration phpunit.xml
